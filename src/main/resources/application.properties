spring.application.name=centralpet

# ─── Perfil ativo ────────────────────────────────────────────────────────────
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ─── Servidor ────────────────────────────────────────────────────────────────
server.port=${PORT:4000}
# ─── Banco de dados ──────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://dpg-d817ccvaqgkc73ao1c8g-a.ohio-postgres.render.com:5432/centralpet}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:centralpet_user}
spring.datasource.password=${DB_PASSWORD:9osYLAkmc7fZ3ourrSZLupv2PNSUzOjD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ─── SQL Init (desativado - Flyway ou schema.sql controlam isso) ─────────────
spring.sql.init.mode=never

# ─── JWT ─────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:dev-centralpet-secret-chave-local-32+chars}
app.jwt.expiration-ms=86400000

# ─── Upload local ────────────────────────────────────────────────────────────
app.upload.dir=uploads
app.base-url=${APP_BASE_URL:http://localhost:4000}

# ─── Google OAuth ────────────────────────────────────────────────────────────
google.client-id=${GOOGLE_CLIENT_ID:138731032989-f4th56mnlgttktq598if8iie11vtfue4.apps.googleusercontent.com}

# ─── Notificacoes ────────────────────────────────────────────────────────────
app.notifications.radius-km=5
app.notifications.expo-url=https://exp.host/--/api/v2/push/send

# ─── AWS S3 ──────────────────────────────────────────────────────────────────
aws.accessKey=${AWS_ACCESS_KEY:}
aws.secretKey=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:us-east-2}
aws.bucketName=${AWS_BUCKET_NAME:pets-app-imagens-adrian-246064377091-us-east-2-an}

# ─── Flyway ──────────────────────────────────────────────────────────────────
spring.flyway.enabled=false

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─── Gmail SMTP ──────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.debug=false

# ─── Recuperacao de senha ────────────────────────────────────────────────────
app.frontend.reset-password-url=${FRONTEND_RESET_URL:http://localhost:8081/redefinir-senha}
