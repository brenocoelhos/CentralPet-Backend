spring.application.name=centralpet

# ─── Perfil ativo (sobrescrito com SPRING_PROFILES_ACTIVE=prod em producao) ───
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ─── Servidor ───────────────────────────────────────────────────────────────
server.port=4000

# ─── Banco de dados ──────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/centralpet}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# ─── JWT ─────────────────────────────────────────────────────────────────────
# Em producao: export JWT_SECRET=$(openssl rand -hex 64)
app.jwt.secret=${JWT_SECRET:dev-centralpet-secret-chave-local-32+chars}
app.jwt.expiration-ms=86400000

# ─── Upload local (fallback sem S3) ──────────────────────────────────────────
app.upload.dir=uploads
app.base-url=${APP_BASE_URL:http://localhost:4000}

# ─── Google OAuth ────────────────────────────────────────────────────────────
google.client-id=${GOOGLE_CLIENT_ID:138731032989-f4th56mnlgttktq598if8iie11vtfue4.apps.googleusercontent.com}

# ─── Notificacoes ────────────────────────────────────────────────────────────
app.notifications.radius-km=5
app.notifications.expo-url=https://exp.host/--/api/v2/push/send

# ─── AWS S3 ──────────────────────────────────────────────────────────────────
# OBRIGATORIO em producao: setar via variaveis de ambiente
aws.accessKey=${AWS_ACCESS_KEY:}
aws.secretKey=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:us-east-2}
aws.bucketName=${AWS_BUCKET_NAME:pets-app-imagens-adrian-246064377091-us-east-2-an}

# ─── Flyway (desabilitado aqui; habilitado em application-prod.properties) ───
spring.flyway.enabled=false

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
