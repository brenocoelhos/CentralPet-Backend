spring.application.name=centralpet

# ─── Perfil ativo ────────────────────────────────────────────────────────────
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ─── Servidor ────────────────────────────────────────────────────────────────
server.port=${PORT:4000}

# ─── Banco de dados ──────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/centralpet}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ─── JWT ─────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ─── Upload local ────────────────────────────────────────────────────────────
app.upload.dir=uploads
app.base-url=${APP_BASE_URL:http://localhost:4000}

# ─── Google OAuth ────────────────────────────────────────────────────────────
google.client-id=${GOOGLE_CLIENT_ID:138731032989-f4th56mnlgttktq598if8iie11vtfue4.apps.googleusercontent.com}

# ─── Notificacoes ────────────────────────────────────────────────────────────
app.notifications.radius-km=5
app.notifications.expo-url=https://exp.host/--/api/v2/push/send

# ─── AWS S3 ──────────────────────────────────────────────────────────────────
aws.accessKey=${AWS_ACCESS_KEY:}
aws.secretKey=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:us-east-2}
aws.bucketName=${AWS_BUCKET_NAME:pets-app-imagens-adrian-246064377091-us-east-2-an}

# ─── Flyway ──────────────────────────────────────────────────────────────────
spring.flyway.enabled=false

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─── Brevo API ───────────────────────────────────────────────────────────────
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME}

# ─── Recuperacao de senha ────────────────────────────────────────────────────
app.frontend.reset-password-url=${FRONTEND_RESET_URL}
